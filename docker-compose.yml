services:
  # --- PostgreSQL Database ---
  postgres:
    image: postgres:16-alpine
    container_name: nutrisnap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-nutrisnap}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nutrisnap_secure_password_2026}
      POSTGRES_DB: ${DB_NAME:-nutrisnap}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nutrisnap} -d ${DB_NAME:-nutrisnap}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- NutriSnap AI Backend API ---
  backend:
    build:
      context: ./nutrisnap-ai/backend
      dockerfile: Dockerfile
    container_name: nutrisnap-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 4000
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      DATABASE_URL: postgres://${DB_USER:-nutrisnap}:${DB_PASSWORD:-nutrisnap_secure_password_2026}@postgres:5432/${DB_NAME:-nutrisnap}
      DATABASE_SSL: "false"
      DB_POOL_MAX: 10
      AUTH_SECRET: ${AUTH_SECRET:-development-auth-secret-nutrisnap-ai-2026}
      AUTH_TOKEN_TTL: 7d
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      STORAGE_DRIVER: local
      STORAGE_BUCKET: nutrisnap-uploads
      MAX_UPLOAD_MB: 8
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://localhost:4000}
    volumes:
      - backend_uploads:/app/uploads
      - backend_data:/app/data
    ports:
      - "4000:4000"

volumes:
  postgres_data:
  backend_uploads:
  backend_data:
